<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Three beads (circles) connected in a chain representing sliding context window -->
  <circle cx="3.5" cy="8" r="2.25" stroke="black" stroke-width="1.2"/>
  <circle cx="8" cy="8" r="2.25" stroke="black" stroke-width="1.2"/>
  <circle cx="12.5" cy="8" r="2.25" stroke="black" stroke-width="1.2"/>
  <!-- Connecting lines between beads -->
  <line x1="5.75" y1="8" x2="5.75" y2="8" stroke="black" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10.25" y1="8" x2="10.25" y2="8" stroke="black" stroke-width="1.2" stroke-linecap="round"/>
</svg>
